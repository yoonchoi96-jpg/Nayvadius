name: Nayvadius Knowledge Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      input_path:
        required: false
        default: data/input.example.jsonl
        type: string
      source:
        required: false
        default: jsonl
        type: choice
        options:
          - jsonl
          - readwise
      location:
        required: false
        default: archive
        type: choice
        options:
          - new
          - later
          - shortlist
          - archive
          - feed
      source_limit:
        required: false
        default: '0'
        type: string
      offset:
        required: false
        default: '0'
        type: string
      limit:
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: nayvadius-knowledge-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e .

      - name: Process knowledge
        env:
          INPUT_PATH: ${{ inputs.input_path || 'data/input.example.jsonl' }}
          SOURCE: ${{ inputs.source || 'jsonl' }}
          LOCATION: ${{ inputs.location || 'archive' }}
          SOURCE_LIMIT: ${{ inputs.source_limit || '0' }}
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '0' }}
          READWISE_ACCESS_TOKEN: ${{ secrets.READWISE_ACCESS_TOKEN }}
          NAYVADIUS_LLM_API_KEY: ${{ secrets.NAYVADIUS_LLM_API_KEY }}
          NAYVADIUS_LLM_BASE_URL: ${{ secrets.NAYVADIUS_LLM_BASE_URL }}
          NAYVADIUS_LLM_MODEL: ${{ secrets.NAYVADIUS_LLM_MODEL }}
        run: |
          if [ "$SOURCE" = "readwise" ]; then
            python -m nayvadius.cli process --source readwise --location "$LOCATION" --source-limit "$SOURCE_LIMIT" --offset "$OFFSET" --limit "$LIMIT" --output output
          else
            python -m nayvadius.cli process --source jsonl --input "$INPUT_PATH" --offset "$OFFSET" --limit "$LIMIT" --output output
          fi

      - name: Commit knowledge
        run: |
          git config user.name 'nayvadius-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output data/*.db || true
          if git diff --cached --quiet; then
            echo 'No knowledge changes to commit.'
          else
            git commit -m 'chore: update knowledge graph'
            git push
          fi
