name: Nayvadius Knowledge Pipeline

on:
  push:
    branches: [main]
    paths:
      - data/abraham_export.jsonl
  workflow_dispatch:
    inputs:
      input_path:
        required: false
        default: data/abraham_export.jsonl
        type: string
      source:
        required: false
        default: abraham
        type: choice
        options: [abraham, abel, jsonl]
      offset:
        required: false
        default: '0'
        type: string
      limit:
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: nayvadius-knowledge-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Process knowledge
        env:
          INPUT_PATH: ${{ inputs.input_path || 'data/abraham_export.jsonl' }}
          SOURCE: ${{ inputs.source || 'abraham' }}
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ ! -f "$INPUT_PATH" ]; then
            echo "Input not present yet: $INPUT_PATH"
            exit 0
          fi
          python -m nayvadius.cli process --source "$SOURCE" --input "$INPUT_PATH" --offset "$OFFSET" --limit "$LIMIT" --output output
      - name: Retry failed documents
        if: always()
        env:
          INPUT_PATH: ${{ inputs.input_path || 'data/abraham_export.jsonl' }}
          SOURCE: ${{ inputs.source || 'abraham' }}
        run: |
          if [ "$SOURCE" != "abraham" ] || [ ! -f "$INPUT_PATH" ]; then
            exit 0
          fi
          python -m nayvadius.cli retry-failed --source abraham --input "$INPUT_PATH" --output output --max-attempts 5
      - name: Commit knowledge
        if: always()
        run: |
          git config user.name 'nayvadius-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output data/*.db || true
          if git diff --cached --quiet; then
            echo 'No knowledge changes to commit.'
          else
            git commit -m 'chore: update knowledge graph'
            git push
          fi
