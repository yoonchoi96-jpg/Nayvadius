name: Nayvadius Process

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m nayvadius.cli process
      # V0 intentionally does not require a self-hosted runner or cloud deployment.
