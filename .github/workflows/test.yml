name: Nayvadius CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: End-to-end smoke test
        id: smoke
        run: python -m nayvadius.cli process --input data/input.example.jsonl --output /tmp/nayvadius-smoke
      - name: Capture smoke failure
        if: failure()
        run: |
          python -m nayvadius.cli process --input data/input.example.jsonl --output /tmp/nayvadius-smoke-debug > smoke_failure.log 2>&1 || true
          git config user.name 'nayvadius-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add smoke_failure.log
          git commit -m 'chore: capture smoke failure diagnostics' || true
          git push || true
