name: Nayvadius CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: End-to-end smoke test
        run: python -m nayvadius.cli process --input data/input.example.jsonl --output /tmp/nayvadius-smoke
      - name: Deterministic knowledge QA gate
        run: python -m nayvadius.cli qa --db data/nayvadius.db --output /tmp/nayvadius-qa
