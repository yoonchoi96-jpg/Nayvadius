name: Nayvadius Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Capture pytest failure
        if: failure()
        run: |
          pytest -q -vv > ci_failure.log 2>&1 || true
          git config user.name 'nayvadius-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add ci_failure.log
          git commit -m 'chore: capture CI failure diagnostics' || true
          git push || true
