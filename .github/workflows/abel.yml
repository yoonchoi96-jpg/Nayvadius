name: Nayvadius Abel Vocabulary Sync

on:
  push:
    branches: [main]
    paths:
      - data/abel_export.csv
      - data/abel_export.jsonl
  workflow_dispatch:
    inputs:
      input_path:
        required: false
        default: data/abel_export.csv
        type: string
      offset:
        required: false
        default: '0'
        type: string
      limit:
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Sync Abel vocabulary in bounded batches
        env:
          INPUT_PATH: ${{ inputs.input_path || 'data/abel_export.csv' }}
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ ! -f "$INPUT_PATH" ]; then
            echo "Abel input not present yet: $INPUT_PATH"
            exit 0
          fi
          if [ "$LIMIT" != "0" ]; then
            python -m nayvadius.cli process --source abel --input "$INPUT_PATH" --offset "$OFFSET" --limit "$LIMIT" --output output
          else
            offset="$OFFSET"
            while true; do
              echo "Processing Abel batch offset=$offset limit=1000"
              python -m nayvadius.cli process --source abel --input "$INPUT_PATH" --offset "$offset" --limit 1000 --output output
              total=$(python -c 'import csv; p="'"$INPUT_PATH"'"; print(sum(1 for _ in csv.DictReader(open(p,encoding="utf-8-sig",newline=""))))' 2>/dev/null || wc -l < "$INPUT_PATH")
              next=$((offset + 1000))
              if [ "$next" -ge "$total" ]; then break; fi
              offset="$next"
            done
          fi
      - name: Commit knowledge
        if: always()
        run: |
          git config user.name 'nayvadius-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output data/*.db || true
          if git diff --cached --quiet; then
            echo 'No vocabulary changes to commit.'
          else
            git commit -m 'chore: sync Abel vocabulary'
            git push
          fi
