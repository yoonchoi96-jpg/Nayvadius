name: Nayvadius Abel Vocabulary Sync

on:
  push:
    branches: [main]
    paths:
      - data/abel_export.csv
      - data/abel_export.jsonl
  workflow_dispatch:
    inputs:
      input_path:
        required: false
        default: data/abel_export.csv
        type: string
      offset:
        required: false
        default: '0'
        type: string
      limit:
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Sync Abel vocabulary
        env:
          INPUT_PATH: ${{ inputs.input_path || 'data/abel_export.csv' }}
          OFFSET: ${{ inputs.offset || '0' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ ! -f "$INPUT_PATH" ]; then
            echo "Abel input not present yet: $INPUT_PATH"
            exit 0
          fi
          python -m nayvadius.cli process --source abel --input "$INPUT_PATH" --offset "$OFFSET" --limit "$LIMIT" --output output
      - name: Commit knowledge
        if: always()
        run: |
          git config user.name 'nayvadius-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add output data/*.db || true
          if git diff --cached --quiet; then
            echo 'No vocabulary changes to commit.'
          else
            git commit -m 'chore: sync Abel vocabulary'
            git push
          fi
