name: Nayvadius Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" > diagnostic.log 2>&1 || true
      - run: pytest -q -x >> diagnostic.log 2>&1 || true
      - run: python -m compileall -q src >> diagnostic.log 2>&1 || true
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(python -c 'import json; print(json.dumps(open("diagnostic.log", encoding="utf-8").read()))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/issues \
            -d "{\"title\":\"TEMP CI diagnostic\",\"body\":$body}"
