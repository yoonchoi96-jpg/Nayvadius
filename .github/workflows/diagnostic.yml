name: Nayvadius Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" > diagnostic.log 2>&1 || true
      - run: pytest -q -x >> diagnostic.log 2>&1 || true
      - run: python -m compileall -q src >> diagnostic.log 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic.log
          git commit -m "chore: capture CI diagnostic log" || true
          git push
