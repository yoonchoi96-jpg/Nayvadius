[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'
[project]
name='nayvadius'
version='0.5.0'
description='Cloud-independent personal knowledge processing engine'
requires-python='>=3.11'
dependencies=[]
[project.optional-dependencies]
dev=['pytest>=8.0']
[tool.pytest.ini_options]
testpaths=['tests']
[tool.setuptools.packages.find]
where=['src']
